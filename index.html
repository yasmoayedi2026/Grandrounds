<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Big Enough to Be Brave</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;600&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E1C1E; --dim:#405B5E;
  --slate:#3B5D64; --cyan:#0C8A84; --cyan-lt:#4EB8B0; --amber:#B8651A; --gold:#9A7016; --red:#B33326;
  --bg:#FBFAF6; --lift:#EEEDE6;
  --accent:var(--slate);
  --rail:56px; --pad:clamp(22px,3.8vw,68px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;min-height:100%}
html{background:#FBFAF6;background-color:#FBFAF6;color-scheme:light}
body{background:#FBFAF6;background:var(--bg,#FBFAF6);background-color:var(--bg,#FBFAF6);color:#0E1C1E;color:var(--ink,#0E1C1E);font-family:"IBM Plex Sans",system-ui,sans-serif;font-weight:400;
  overflow:hidden;transition:background 1.1s cubic-bezier(.4,0,.2,1)}
/* the deck heats up as the program grows */
body[data-heat="0"]{--accent:#3B5D64;--bg:#FBFAF6;--lift:#EEEDE6}
body[data-heat="1"]{--accent:#0C8A84;--bg:#F7FAF9;--lift:#E7EFEE}
body[data-heat="2"]{--accent:#B8651A;--bg:#FDF8F1;--lift:#F2E9DC}
body[data-heat="3"]{--accent:#9A7016;--bg:#FDF6EA;--lift:#F3E7D2}

#bg{position:fixed;inset:0;z-index:0;background:#FBFAF6;background-color:var(--bg,#FBFAF6);transition:background-color 1.1s cubic-bezier(.4,0,.2,1)}
#deck{position:fixed;inset:0 0 var(--rail) 0;overflow:hidden;z-index:1;background-color:var(--bg,#FBFAF6)}
.slide{position:absolute;inset:0;padding:var(--pad);display:flex;flex-direction:column;justify-content:center;
  opacity:0;visibility:hidden;transition:opacity .5s ease,visibility .5s;overflow-y:auto;overflow-x:hidden;background-color:var(--bg,#FBFAF6)}
.slide.live{opacity:1;visibility:visible}
.slide.full{padding:0;justify-content:stretch}

.eyebrow{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:clamp(12px,1.2vw,16px);letter-spacing:.26em;text-transform:uppercase;
  color:var(--accent);margin-bottom:1.2rem;display:flex;gap:.9rem;align-items:center}
.eyebrow::after{content:none}
h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:clamp(38px,calc(4.2vw + 4.2vh),112px);line-height:.9;letter-spacing:-.035em;text-wrap:balance}
h2{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:clamp(26px,calc(2.4vw + 2.4vh),60px);line-height:.99;letter-spacing:-.028em;margin-bottom:1rem;text-wrap:balance}
h3{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:clamp(17px,calc(0.9vw + 0.9vh),24px);line-height:1.18;margin-bottom:.35rem}
p,li{font-size:clamp(17px,calc(0.85vw + 0.85vh),24px);line-height:1.55;color:var(--dim);max-width:50ch;font-weight:400}
strong{color:var(--ink);font-weight:600}
em{font-style:normal;color:var(--accent);font-weight:400}
.lede{font-size:clamp(20px,calc(1.15vw + 1.15vh),31px);line-height:1.3;color:var(--ink);max-width:28ch;font-weight:500}
.sub{margin-top:1rem}
.mono{font-family:"IBM Plex Mono",monospace;font-weight:500;font-size:clamp(13px,1.25vw,17px);letter-spacing:.05em;color:var(--dim);opacity:1}
.verify{border-bottom:1px dotted var(--red);cursor:help}
ul{list-style:none;max-width:58ch}
ul li{position:relative;padding-left:1.5rem;margin-bottom:.85rem}
ul li::before{content:"";position:absolute;left:0;top:.72em;width:8px;height:1px;background:var(--accent)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:clamp(15px,2.2vw,34px);margin-top:1.1rem}
.card{border-top:2px solid var(--accent);padding-top:.8rem}
.card .n{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.18em;color:var(--accent);display:block;margin-bottom:.4rem}
.card p{font-size:clamp(14.5px,calc(0.7vw + 0.7vh),18.5px);line-height:1.48}
.split{display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);gap:clamp(20px,3.4vw,58px);align-items:center}
.stagew{width:100%}
svg{width:100%;height:auto;overflow:visible;display:block}
svg text{font-family:"IBM Plex Mono",monospace;fill:var(--dim);font-weight:500}
.lede{font-weight:400}
.lab{font-size:17px;letter-spacing:.1em;font-weight:600}
@media(max-width:840px){.split{grid-template-columns:1fr;gap:16px}}

[data-frag]{opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s ease}
[data-frag].shown{opacity:1;transform:none}

.fa-line{font-family:"Noto Nastaliq Urdu",serif;direction:rtl;text-align:right;
  font-size:clamp(24px,calc(1.5vw + 1.5vh),44px);line-height:2.5;color:var(--accent);
  margin:.2rem 0 1.4rem;padding-bottom:.2rem}
.slide.live .fa-line{animation:faIn 1.6s cubic-bezier(.16,.9,.24,1) both}
@keyframes faIn{from{opacity:0;transform:translateY(14px);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}

.imgframe{margin:1.2rem auto 0;max-width:720px;aspect-ratio:4/3;border:2px dashed var(--accent);
  border-radius:3px;display:flex;align-items:center;justify-content:center;background:var(--lift);padding:1.4rem;text-align:center}
.imgframe img{width:100%;height:100%;object-fit:contain;display:block}

/* Katie Yost anchor image — drop the file in beside this HTML as yost.png */
.anchor{position:relative;width:100%;max-width:640px;margin:0 auto;aspect-ratio:1/1;
  border:1px solid rgba(0,0,0,.16);background:var(--lift);overflow:hidden}
.anchor img{width:100%;height:100%;object-fit:cover;display:block;
  animation:anchorIn 1.8s cubic-bezier(.16,.9,.24,1) both}
@keyframes anchorIn{from{opacity:0;transform:scale(1.08);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}
.anchor .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  text-align:center;padding:1.6rem;font-family:"IBM Plex Mono",monospace;font-size:13px;
  line-height:1.6;color:var(--dim);border:2px dashed var(--accent)}
.anchor .ph{display:none}
.anchor .glow{position:absolute;left:52%;top:44%;width:14%;height:14%;border-radius:50%;
  background:radial-gradient(circle,rgba(80,220,140,.55),transparent 70%);
  animation:glow 3.2s ease-in-out infinite;pointer-events:none}
@keyframes glow{0%,100%{opacity:.35;transform:scale(.9)}50%{opacity:1;transform:scale(1.15)}}
.credit{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.06em;
  color:var(--dim);text-align:right;margin-top:.5rem}

/* handoff divider */
.handoff{text-align:center;max-width:34ch;margin:0 auto}
.handoff .who{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;
  font-size:clamp(30px,calc(2.6vw + 2.6vh),64px);letter-spacing:-.025em;line-height:1.02;color:var(--ink)}
.handoff .role{font-family:"IBM Plex Mono",monospace;font-size:clamp(12px,1.2vw,16px);
  letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-top:1rem}
.handoff .bar{height:3px;background:var(--accent);margin:1.6rem auto 0;width:0;
  animation:growbar 1.2s cubic-bezier(.16,.86,.26,1) .5s both}
@keyframes growbar{to{width:210px}}

.ytwrap{position:relative;width:100%;aspect-ratio:16/9;background:var(--lift);
  border:1px solid rgba(0,0,0,.16);box-shadow:0 14px 40px rgba(0,0,0,.14);margin-top:.6rem}
.ytwrap iframe,.ytwrap video{position:absolute;inset:0;width:100%;height:100%;border:0}
.ytwrap #driveVid{z-index:2}
.vidfall{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:1.4rem;border:2px dashed var(--accent);background:var(--lift)}
.ytwrap.hasvideo .vidfall{display:none}
.vidfall{z-index:3}

.namelist{margin-top:1.7rem}
.dedline{font-size:clamp(15px,calc(.8vw + .8vh),20px);line-height:1.55;color:var(--dim);
  max-width:44ch;margin-top:1.1rem}
.nl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(162px,1fr));gap:.8rem 1.6rem}
.nl-grid span{display:block;line-height:1.3;opacity:0}
.slide.live .nl-grid span{animation:nameIn 1.15s cubic-bezier(.17,.84,.24,1) both}
@keyframes nameIn{from{opacity:0;transform:translateY(46px) scale(.96);filter:blur(9px)}
  60%{opacity:1;filter:blur(0)}
  to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
.slide.live .nl-grid span:nth-child(1){animation-delay:1.00s}
.slide.live .nl-grid span:nth-child(2){animation-delay:1.16s}
.slide.live .nl-grid span:nth-child(3){animation-delay:1.32s}
.slide.live .nl-grid span:nth-child(4){animation-delay:1.48s}
.slide.live .nl-grid span:nth-child(5){animation-delay:1.64s}
.slide.live .nl-grid span:nth-child(6){animation-delay:1.80s}
.slide.live .nl-grid span:nth-child(7){animation-delay:1.96s}
.slide.live .nl-grid span:nth-child(8){animation-delay:2.12s}
.slide.live .nl-grid span:nth-child(9){animation-delay:2.28s}
.slide.live .nl-grid span:nth-child(10){animation-delay:2.44s}
.slide.live .nl-grid span:nth-child(11){animation-delay:2.60s}
.slide.live .nl-grid span:nth-child(12){animation-delay:2.76s}
.nl-grid b{display:block;font-family:"Noto Nastaliq Urdu",serif;direction:rtl;text-align:right;
  font-weight:400;font-size:clamp(15px,1.45vw,20px);line-height:2.05;color:var(--accent)}
.nl-grid i{display:block;font-style:normal;font-size:clamp(12px,1.15vw,15px);
  color:var(--ink);opacity:.9;margin-top:-.15rem}







.byline{display:flex;flex-wrap:wrap;gap:1.5rem 3.2rem}
.person{min-width:210px}
.p-fa{font-family:"Noto Nastaliq Urdu",serif;direction:rtl;text-align:right;
  font-size:clamp(17px,1.7vw,25px);line-height:2.15;color:var(--accent);margin-bottom:.1rem}
.p-en{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;
  font-size:clamp(15px,1.55vw,21px);color:var(--ink);line-height:1.25}
.p-role{font-family:"IBM Plex Mono",monospace;font-size:clamp(11px,1.08vw,14px);
  letter-spacing:.09em;color:var(--dim);margin-top:.3rem;line-height:1.4}
.affil{margin-top:1.9rem}
.name-fa{font-family:"Noto Nastaliq Urdu",serif;direction:rtl;text-align:right;
  font-size:clamp(15px,1.5vw,21px);line-height:2;color:var(--accent);margin-top:.15rem}

.statline{margin-top:1.6rem;display:flex;flex-wrap:wrap;align-items:baseline;gap:.5rem 1rem}
.st-n{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;
  font-size:clamp(40px,calc(2.6vw + 2.6vh),74px);line-height:1;letter-spacing:-.03em;color:var(--red)}
.st-u{font-family:"IBM Plex Mono",monospace;font-size:clamp(12px,1.2vw,16px);
  letter-spacing:.13em;text-transform:uppercase;color:var(--red)}
.st-l{flex:1 1 100%;font-size:clamp(13.5px,1.3vw,17px);line-height:1.5;color:var(--dim)}

.patients{display:flex;flex-wrap:wrap;gap:clamp(7px,.85vw,12px);align-items:flex-start;
  margin-top:clamp(12px,1.6vh,22px);justify-content:flex-start}
.pt-card{margin:0;width:clamp(84px,8.4vw,124px);aspect-ratio:1/1;overflow:hidden;border-radius:2px;
  border:1px solid rgba(0,0,0,.18);opacity:0}
.slide.live .pt-card{animation:ptIn .8s cubic-bezier(.16,.9,.24,1) var(--d,0s) both}
@keyframes ptIn{from{opacity:0;transform:translateY(18px) scale(.94);filter:blur(6px)}
  to{opacity:1;transform:none;filter:blur(0)}}
.pt-card img{width:100%;height:100%;object-fit:cover;display:block}
.pt-cap{flex:1 1 100%;font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.08em;
  color:var(--dim);margin-top:.35rem}

.pt-side{display:flex;align-items:center;gap:.9rem;margin-top:1.6rem}
.pt-lg{width:clamp(74px,7.5vw,104px);flex:0 0 auto;opacity:1;animation:none}
.slide.live .pt-lg{animation:ptIn .8s cubic-bezier(.16,.9,.24,1) .9s both}

.mapsplit{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(150px,1fr);
  gap:clamp(14px,2.4vw,40px);align-items:start;margin-top:clamp(10px,1.4vh,20px)}
@media(max-width:560px){.mapsplit{grid-template-columns:1fr}}
.mapsplit .patients{margin-top:0}
.mapsplit .pt-card{width:clamp(58px,7vw,110px)}
.mapsplit .stagew{align-self:start}

.mailcard{background:var(--lift);border:1px solid rgba(0,0,0,.16);border-radius:3px;
  box-shadow:0 12px 34px rgba(0,0,0,.12);overflow:hidden}
.mail-hd{display:flex;align-items:center;gap:.6rem;padding:.6rem .9rem;border-bottom:1px solid rgba(0,0,0,.14)}
.mail-hd .mono{font-size:12px;letter-spacing:.12em}
.mail-body{padding:.5rem .9rem .7rem}
.mail-row{display:grid;grid-template-columns:clamp(88px,9vw,124px) 1fr;gap:.7rem;padding:.42rem 0;
  border-bottom:1px solid rgba(0,0,0,.07);opacity:0}
.slide.live .mail-row{animation:rise .6s cubic-bezier(.16,.9,.24,1) var(--d,0s) both}
.mk{font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.mv{font-size:clamp(13px,1.25vw,16px);line-height:1.45;color:var(--ink)}
.mail-foot{padding:.5rem .9rem;border-top:1px solid rgba(0,0,0,.12);font-size:11.5px;color:var(--dim)}

.lex{display:grid;gap:.15rem}
.lex-row{display:grid;grid-template-columns:clamp(96px,11vw,168px) 1fr;gap:clamp(10px,1.6vw,26px);
  align-items:baseline;padding:.42rem 0;opacity:0}
.slide.live .lex-row{animation:rise .65s cubic-bezier(.16,.9,.24,1) var(--d,0s) both}
.lx-t{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;
  font-size:clamp(15px,calc(.85vw + .85vh),22px);color:var(--accent);letter-spacing:-.01em}
.lx-d{font-size:clamp(13.5px,calc(.68vw + .68vh),18px);line-height:1.45;color:var(--dim);max-width:74ch}
.lx-d b{color:var(--ink);font-weight:600}

.pullq{margin:1.3rem 0 0;padding:0 0 0 1.1rem;border-left:3px solid var(--red);
  font-size:clamp(16px,calc(.95vw + .95vh),24px);line-height:1.42;color:var(--ink);font-style:normal}

.clipping{border:1px solid rgba(0,0,0,.2);background:rgba(255,255,255,.62);padding:clamp(14px,1.7vw,24px);
  box-shadow:0 10px 28px rgba(0,0,0,.1)}
.clip-kicker{font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--dim);margin-bottom:.7rem}
.clip-head{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;line-height:1.02;
  font-size:clamp(20px,calc(1.2vw + 1.2vh),32px);color:var(--ink);letter-spacing:-.02em}
.clip-by{font-family:"IBM Plex Mono",monospace;font-size:12.5px;letter-spacing:.1em;color:var(--dim);margin-top:.6rem}
.clip-note{font-size:clamp(13px,calc(.62vw + .62vh),16.5px);line-height:1.5;color:var(--dim);margin-top:.9rem}

.refline{font-family:"IBM Plex Mono",monospace;font-size:clamp(11px,1.05vw,13.5px);
  line-height:1.5;color:var(--dim);margin-top:1rem;padding-top:.65rem;
  border-top:1px solid rgba(0,0,0,.14);max-width:62ch}

.qrblock{display:flex;align-items:center;gap:clamp(12px,1.5vw,22px);margin-top:1.2rem;
  padding:.85rem 1rem;background:rgba(255,255,255,.6);border:1px solid rgba(0,0,0,.16)}
.qr{width:clamp(74px,7.5vw,104px);height:auto;flex:0 0 auto;shape-rendering:crispEdges}
.qr-t{font-family:"IBM Plex Mono",monospace;font-size:clamp(12px,1.15vw,15px);
  letter-spacing:.04em;color:var(--ink);font-weight:500}
.qr-s{font-family:"IBM Plex Mono",monospace;font-size:11.5px;line-height:1.6;color:var(--dim);margin-top:.35rem}

.devbox{opacity:0;animation:rise .9s cubic-bezier(.16,.9,.24,1) 2.6s both;text-align:center}
.devbox img{width:100%;max-width:200px;height:auto;display:block;margin:0 auto}
.dev-t{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:26px;
  color:var(--accent);letter-spacing:-.02em;margin-top:.2rem}
.dev-s{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--dim);margin-top:.15rem}

/* ---------- section dividers ---------- */
.sectdiv{max-width:34ch}
.sd-n{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:clamp(13px,1.4vw,18px);
  letter-spacing:.26em;color:var(--accent);margin-bottom:.9rem}
.sd-sub{font-size:clamp(15px,calc(.8vw + .8vh),20px);line-height:1.55;color:var(--dim);margin-top:1.1rem;max-width:40ch}
.sd-bar{display:none}
@keyframes sdbar{to{width:230px}}

/* ---------- agenda ---------- */
.agenda{position:relative;max-width:none;padding-left:0}
.ag-row{display:grid;grid-template-columns:auto 1fr;gap:clamp(14px,2vw,32px);align-items:baseline;
  padding:.9rem 0;opacity:0}
.slide.live .ag-row{animation:agIn 1s cubic-bezier(.17,.86,.24,1) var(--del,0s) both}
@keyframes agIn{from{opacity:0;transform:translateY(26px);filter:blur(6px)}
  to{opacity:1;transform:none;filter:blur(0)}}
.ag-n{font-family:"IBM Plex Mono",monospace;font-weight:600;
  font-size:clamp(13px,1.3vw,17px);letter-spacing:.16em;color:var(--accent);white-space:nowrap}
.ag-body h3{margin-bottom:.25rem}
.ag-body p{font-size:clamp(14px,calc(.72vw + .72vh),18.5px);line-height:1.5;color:var(--dim);max-width:70ch;margin:0}

/* ================= MUSICAL INTERLUDES ================= */
.interlude{max-width:52ch;margin:0 auto;text-align:center}
.piece-fa{font-family:"Noto Nastaliq Urdu",serif;direction:rtl;
  font-size:clamp(30px,calc(2vw + 2vh),58px);line-height:2.1;color:var(--ink);margin:.2rem 0 .3rem}
.piece-en{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;
  font-size:clamp(17px,calc(1vw + 1vh),26px);color:var(--accent);letter-spacing:-.01em}
.piece-meta{font-family:"IBM Plex Mono",monospace;font-size:clamp(11px,1.1vw,14px);
  letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-top:.9rem;line-height:2}
.piece-note{font-size:clamp(15px,calc(.8vw + .8vh),20px);color:var(--dim);
  margin:1.5rem auto 0;max-width:44ch;line-height:1.55}
/* animated waveform — reads as "audio is playing" */
.wave{display:flex;align-items:center;justify-content:center;gap:4px;height:56px;margin:1.6rem 0 .3rem}
.wave i{display:block;width:4px;border-radius:2px;background:var(--accent);
  animation:wv 1.25s ease-in-out infinite;transform-origin:center}
@keyframes wv{0%,100%{height:8px;opacity:.4}50%{height:var(--h,34px);opacity:1}}
.cue{display:inline-flex;align-items:center;gap:.55rem;font-family:"IBM Plex Mono",monospace;
  font-size:12.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--gold);
  border:1px solid var(--gold);border-radius:2px;padding:.35rem .8rem;margin-top:1.3rem;cursor:pointer;
  background:transparent}
.cue:hover{background:rgba(154,112,22,.1)}
.cue.playing{background:var(--gold);color:var(--bg)}

/* ================= BIG MOTION ================= */
.draw{stroke-dasharray:var(--len,1400);stroke-dashoffset:var(--len,1400);
  animation:draw var(--dur,2.6s) var(--ease,cubic-bezier(.2,.65,.25,1)) var(--del,0s) forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* cinematic entrance: big scale + blur clear */
.cine{animation:cine 1.4s cubic-bezier(.16,.9,.24,1) var(--del,0s) both}
@keyframes cine{from{opacity:0;transform:scale(1.14) translateY(26px);filter:blur(14px)}
  to{opacity:1;transform:none;filter:blur(0)}}

/* the flywheel — accelerates, never stops */
.wheel{transform-box:fill-box;transform-origin:center;animation:spin 22s cubic-bezier(.3,0,.7,1) 0s 1 normal forwards,
  spin2 6s linear 22s infinite}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(900deg)}}
@keyframes spin2{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.wheel-fast{transform-box:fill-box;transform-origin:center;animation:spin2 3.2s linear infinite}

/* stacked area / bars rising */
.growup{transform-box:fill-box;transform-origin:bottom center;animation:growup 1.5s cubic-bezier(.16,.86,.26,1) var(--del,0s) both}
@keyframes growup{from{transform:scaleY(0);opacity:.2}to{transform:scaleY(1);opacity:1}}
.growx{transform-box:fill-box;transform-origin:left center;animation:growx 1.5s cubic-bezier(.16,.86,.26,1) var(--del,0s) both}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}

.pop{animation:pop .6s cubic-bezier(.2,1.6,.35,1) var(--del,0s) both}
@keyframes pop{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}

.rise{animation:rise 1s cubic-bezier(.16,.9,.24,1) var(--del,0s) both}
@keyframes rise{from{opacity:0;transform:translateY(38px)}to{opacity:1;transform:none}}

.inx{animation:inx .95s cubic-bezier(.16,.9,.24,1) var(--del,0s) both}
@keyframes inx{from{opacity:0;transform:translateX(var(--fx,-46px))}to{opacity:1;transform:none}}

/* pulses travelling inward along referral spokes */
.flow{offset-path:var(--p);animation:flow var(--fd,3s) cubic-bezier(.4,0,.7,1) var(--fdl,0s) infinite}
@keyframes flow{from{offset-distance:0%;opacity:0}12%{opacity:1}to{offset-distance:100%;opacity:0}}

.ring{transform-box:fill-box;transform-origin:center;animation:ring 2.6s cubic-bezier(.2,.6,.4,1) var(--del,0s) infinite}
@keyframes ring{0%{transform:scale(.35);opacity:.9}100%{transform:scale(2.6);opacity:0}}

/* gate opening */
.gateL{animation:gateL 1s cubic-bezier(.5,0,.2,1) var(--del,0s) both}
.gateR{animation:gateR 1s cubic-bezier(.5,0,.2,1) var(--del,0s) both}
@keyframes gateL{from{transform:translateX(0)}to{transform:translateX(-58px)}}
@keyframes gateR{from{transform:translateX(0)}to{transform:translateX(58px)}}

.beat{transform-box:fill-box;transform-origin:center;animation:beat 1.05s cubic-bezier(.3,0,.35,1) infinite}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.09)}24%{transform:scale(.99)}36%{transform:scale(1.05)}48%{transform:scale(1)}}

.sweep{animation:sweep 4s cubic-bezier(.4,0,.5,1) infinite}
@keyframes sweep{0%{transform:translateX(0);opacity:0}8%{opacity:.9}92%{opacity:.9}100%{transform:translateX(var(--sx,900px));opacity:0}}

.slide [class*="cine"],.slide [class*="growup"],.slide [class*="growx"],.slide .draw{animation-play-state:paused}
.slide.live [class*="cine"],.slide.live [class*="growup"],.slide.live [class*="growx"],.slide.live .draw{animation-play-state:running}


/* ================= LIVE DASHBOARD ================= */
.dash{background:var(--lift);border:1px solid rgba(0,0,0,.14);border-radius:4px;
  padding:clamp(10px,1.3vw,18px);margin-top:.9rem;box-shadow:0 14px 40px rgba(0,0,0,.13);
  animation:cine 1.1s cubic-bezier(.16,.9,.24,1) both}
.dash.tight{margin-top:0}
.dash-hd{display:flex;align-items:center;gap:.7rem;padding-bottom:.6rem;margin-bottom:.75rem;
  border-bottom:1px solid rgba(0,0,0,.14)}
.dash-hd .mono{font-size:13.5px;letter-spacing:.14em;text-transform:uppercase;opacity:1}
.dot{width:8px;height:8px;border-radius:50%;background:var(--gold);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(154,112,22,.45)}50%{opacity:.5;box-shadow:0 0 0 7px rgba(154,112,22,0)}}
.live-tag{color:var(--gold);border:1px solid var(--gold);padding:2px 7px;border-radius:2px;font-size:12px!important}

@media(max-width:820px){.kpis{grid-template-columns:repeat(3,1fr)}}

.panel{background:rgba(255,255,255,.75);padding:.6rem .7rem .5rem}

@keyframes tick{from{transform:translateY(0)}to{transform:translateY(-50%)}}
.ticker .row{display:flex;gap:.5rem;align-items:center;font-family:"IBM Plex Mono",monospace;

.ticker .d{flex:1;color:var(--ink);opacity:1}

.ticker .accept{color:var(--gold);border:1px solid var(--gold)}

  border:1px solid rgba(154,112,22,.5);padding:2px 8px;border-radius:2px}

{heat:0,vol:28,phase:'Agenda',
notes:'Give the room the map. Four movements. Say that the last one is where we are asking for something.',
html:`<div class="eyebrow">Where we are going</div>
 <h2 style="margin-bottom:1.4rem">Agenda</h2>
 <div class="agenda">
  ${[['01','The status quo',
      'How many patients are waiting &middot; how many we transplant &middot; how we assess the donors we are offered'],
     ['02','What we are changing',
      'Why a small programme cannot take chances, and the four things we did about it'],
     ['03','The vision',
      'What the numbers make possible &middot; 2027, 2028, 2029']]
   .map((r,i)=>`
   <div class="ag-row" style="--del:${.4+i*.5}s">
    <span class="ag-n">${r[0]}</span>
    <div class="ag-body">
     <h3>${r[1]}</h3>
     <p>${r[2]}</p>
    </div>
   </div>`).join('')}
  <div class="ag-spine"></div>
 </div>`},

{heat:0,vol:28,phase:'Lexicon',
notes:'',
html:`<div class="eyebrow">Before we start &#183; the words we will use</div>
 <h2 style="margin-bottom:1.2rem">Nine terms</h2>
 <div class="lex">
  ${[['PGD','Primary graft dysfunction','The transplanted heart fails to work in the first hours. The commonest cause of early death after transplant.'],
     ['DBD','Donation after brain death','The traditional donor. Circulation is maintained until the heart is retrieved.'],
     ['DCD','Donation after circulatory death','The heart has stopped before retrieval. Until recently we would not use these.'],
     ['ABOi','ABO-incompatible','Transplanting across blood groups. Standard in infants; still exceptional in adults.'],
     ['cPRA','Calculated panel reactive antibody','How much of the donor pool a patient&rsquo;s antibodies rule out. High cPRA means almost nobody matches.'],
     ['CPET','Cardiopulmonary exercise test','The test that tells us how severe the heart failure really is. Our front door.'],
     ['Vasoplegia','','Profound vasodilation after bypass. The blood pressure will not come up despite a working heart.'],
     ['CAV','Cardiac allograft vasculopathy','Diffuse coronary disease unique to the transplanted heart. Silent, because a transplanted heart has no nerves.'],
     ['Ex vivo perfusion','','Keeping the donor heart perfused and monitored outside the body during transport, rather than on ice.']]
   .map((r,i)=>`
   <div class="lex-row" style="--d:${.3+i*.13}s">
    <span class="lx-t">${r[0]}</span>
    <span class="lx-d"><b>${r[1]}</b>${r[1]?' &middot; ':''}${r[2]}</span>
   </div>`).join('')}
 </div>`},

{heat:0,vol:28,phase:'جام جم',
notes:'',
html:`<div class="split">
 <div>
  <div class="eyebrow">Hafez &middot; the cup of Jamshid</div>
  <div class="fa-line">سال‌ها دل طلب جام جم از ما می‌کرد<br>آنچه خود داشت ز بیگانه تمنا می‌کرد</div>
  <p class="lede sub" data-frag>For years my heart sought Jamshid&rsquo;s cup from me, begging of strangers what it already possessed.</p>
  <p class="sub" data-frag>The <em>Jaam-e Jam</em> showed the whole world in its surface. Jamshid could see everything, everywhere, at once.</p>
  <p class="sub" data-frag>We went looking for that cup. We had been <strong>sitting on the data all along</strong> and had never made it visible to ourselves.</p>
  <p class="sub" data-frag>So we begin where any honest account has to begin: <em>with our own status quo.</em></p>
 </div>

{heat:0,vol:28,phase:'Sex',

html:`<div class="split">
 <div>

  <h2>The loss happens before they reach us</h2>
  <p data-frag>Women are 37% of the patients who come for exercise testing, and 38% of the patients we transplant.</p>
  <p class="sub" data-frag>Once a woman reaches this building she is <strong>not</strong> less likely to be transplanted. The under-representation is entirely <em>upstream</em>: at recognition, at referral, at the point where someone decides this patient needs advanced assessment.</p>
  <p class="sub" data-frag>That is not a selection problem in our programme. It is a <strong>front door problem</strong> in the system that feeds us.</p>

{heat:1,vol:61,phase:'Listing criteria',
notes:'',
html:`<div class="split" style="align-items:start">
 <div>
  <div class="eyebrow">Who we are allowed to list</div>
  <h2>The criteria decide who is even eligible to wait</h2>
  <p data-frag>Listing is governed by consensus criteria, not by us alone. The 2024 ISHLT guideline sets out what we assess in every candidate.</p>
  <p class="sub" data-frag>Most of these are not yes or no. They are <em>thresholds a programme chooses where to draw</em>, and a small programme draws them conservatively.</p>
  <p class="mono sub" data-frag>ISHLT Guidelines for the Care of Heart Transplant Candidates, 2024. Verify each threshold against the published document before presenting.</p>
 </div>
 <div class="stagew"><svg viewBox="0 0 470 340" aria-label="Domains assessed in listing candidates">
  ${['Severity of heart failure and prognosis','Pulmonary vascular resistance','Renal and hepatic function',
     'Age and frailty','Obesity and nutritional status','Diabetes and end-organ damage','Malignancy history',
     'Infection and immunisation status','Allosensitization and antibodies','Substance use',
     'Adherence and psychosocial support']
   .map((t,i)=>`
   <g class="cine" style="--del:${.25+i*.13}s">
    <circle cx="8" cy="${18+i*29}" r="4" fill="var(--accent)"/>

{heat:0,vol:28,phase:'Why it matters',
notes:'Open on the patient, not the programme. These are people who die of a disease we know how to treat. Every conservative decision has a cost that lands on someone who is not in the room.',
html:`<div class="split">
 <div>
  <div class="eyebrow">Why this matters</div>
  <h2>Our patients do not die of an untreatable disease</h2>
  <p data-frag>They die of a treatable one, waiting for an organ that existed, in a country that had it, while we decided we could not take the chance.</p>
  <p class="sub" data-frag>Every decline is a clinical judgement. It is also a <em>transfer of risk</em>: off the programme, onto a patient who will never know it happened.</p>
  <div class="statline" data-frag>
   <span class="st-n" data-count="19.9" data-dec="1" data-del="300">0</span>
   <span class="st-u">per 100 patient-years</span>
   <span class="st-l">died waiting or deteriorated beyond transplant<br>on our own list, January to July 2026</span>
  </div>
 </div>
 <div class="stagew"><svg viewBox="0 0 440 300" aria-label="Waitlist attrition over time">
  <line x1="30" y1="250" x2="420" y2="250" stroke="var(--dim)" stroke-width="1" opacity=".35"/>
  ${Array.from({length:24},(_,i)=>{const x=44+(i%8)*48,y=60+Math.floor(i/8)*58,lost=i%4===2;
   return `<g class="pop" style="--del:${.2+i*.05}s"><circle cx="${x}" cy="${y}" r="11" fill="none"
     stroke="${lost?'var(--red)':'var(--slate)'}" stroke-width="2.4" opacity="${lost?1:.55}"/>
     ${lost?`<path d="M${x-6},${y-6} L${x+6},${y+6} M${x+6},${y-6} L${x-6},${y+6}" stroke="var(--red)" stroke-width="2.2"
       class="draw" style="--len:20;--dur:.4s;--del:${1.6+i*.05}s"/>`:''}</g>`;}).join('')}
  <text x="30" y="284" class="lab" fill="var(--red)">DIED OR DELISTED WAITING</text>
 </svg></div>
</div>`},

{heat:1,vol:61,phase:'Outcomes',
notes:'',
html:`<div class="split" style="align-items:center">
 <div>
  <div class="eyebrow">What a transplant actually buys</div>
  <h2>A median of fifteen years</h2>
  <p data-frag>Roughly <strong>90%</strong> alive at one year. <strong>80%</strong> at five. About <strong>two thirds</strong> at ten, and <strong>half</strong> at fifteen.</p>
  <p class="sub" data-frag>For someone dying of heart failure that is an extraordinary offer. It is also, plainly, <em>not a cure</em>. We exchange one fatal disease for a chronic one that has to be managed for the rest of a life.</p>
  <p class="mono sub" data-frag>ISHLT Thoracic Organ Transplant Registry, most recent report. Amy Silverstein, New York Times, 18 April 2023.</p>
 </div>
 <div class="stagew"><svg viewBox="0 0 470 310" aria-label="Survival after adult heart transplantation">
  <line x1="52" y1="250" x2="452" y2="250" stroke="var(--dim)" stroke-width="1" opacity=".3"/>
  <line x1="52" y1="26" x2="52" y2="250" stroke="var(--dim)" stroke-width="1" opacity=".3"/>
  <text x="44" y="32" text-anchor="end" style="font-size:12px">100%</text>
  <text x="44" y="254" text-anchor="end" style="font-size:12px">0</text>

{heat:1,vol:61,phase:'Donor utilization',
notes:'',
html:`<div class="split" style="align-items:center">
 <div>
  <div class="eyebrow">How we assess donors</div>
  <h2>We look at four hearts for every one we take</h2>
  <p data-frag>Across our donor quality dataset there were <strong>1,256 offers</strong>. We accepted <strong>278</strong>.</p>
  <p class="sub" data-frag>That is <strong>22.9%</strong>. Put another way, <em>4.4 offers for every heart transplanted</em>. Median donor age 41.</p>
  <p class="sub" data-frag>Nine hundred and thirty-eight times we said no. Each of those was a judgement made at speed, usually overnight, usually by one person.</p>
 </div>
 <div class="stagew"><svg viewBox="0 0 470 330" aria-label="Donor offers accepted and declined">
  ${Array.from({length:100},(_,i)=>{const acc=i<23;
   return `<circle cx="${22+(i%10)*48}" cy="${26+Math.floor(i/10)*29}" r="${acc?10:8}"
     fill="${acc?'var(--cyan)':'none'}" stroke="${acc?'none':'var(--dim)'}" stroke-width="2"
     opacity="${acc?1:.45}" class="pop" style="--del:${.2+i*.014}s"/>`;}).join('')}
  <text x="0" y="322" class="lab" style="font-size:13px;fill:var(--cyan);opacity:0;animation:rise .8s ease 1.9s both">23 ACCEPTED PER 100 OFFERS</text>
 </svg></div>
</div>`},

{heat:1,vol:61,phase:'A donor offer',
notes:'',
html:`<div class="split" style="align-items:start">
 <div>
  <div class="eyebrow">How an offer actually arrives</div>
  <h2>This is the decision, as we receive it</h2>
  <p data-frag>An email, late in the evening. Attachments. Angiogram images on a <strong>compact disc</strong> that must be physically couriered if we want to see them.</p>
  <p class="sub" data-frag>From this, overnight, one person decides whether eight candidates live or keep waiting.</p>
  <p class="sub" data-frag><strong style="color:var(--red);font-size:1.18em">This is the state of the art.</strong></p>
 </div>
 <div class="stagew">
  <div class="mailcard">
   <div class="mail-hd"><span class="dot"></span><span class="mono">HEART OFFER &#183; RECEIVED 21:34</span></div>
   <div class="mail-body">
${[['Donor','33 F &#183; 159 cm &#183; 76.8 kg &#183; BMI 30.4 &#183; O Pos'],
   ['Referring centre','Regional hospital, NDD'],
   ['Cause of death','Unknown &#183; hypoxic brain injury'],
   ['Extended criteria','Positive blood cultures &#183; unknown cause of death &#183; unknown medical and social history'],
   ['History','Daily stimulant use, ceased four months ago &#183; alcohol &#183; no family physician &#183; unhoused &#183; psychosis'],
   ['Investigations','Angiogram on CD, to be couriered &#183; echo attached'],
   ['Candidates','8 potential recipients &#183; 4 crossmatch positive &#183; 2 requiring clarification'],
   ['OR','Tomorrow, time to be determined']]
  .map((r,i)=>`<div class="mail-row" style="--d:${.5+i*.16}s"><span class="mk">${r[0]}</span><span class="mv">${r[1]}</span></div>`).join('')}
   </div>
   <div class="mail-foot mono">Redacted. Names and identifiers removed.</div>
  </div>

{heat:0,vol:61,phase:'Off hours',
notes:'',
html:`<div class="split" style="align-items:center">
 <div>
  <div class="eyebrow">A bias we went looking for</div>
  <h2>Are we more likely to decline on a weekend?</h2>
  <p data-frag>The field has already tested the <em>mystical</em> explanations. A UNOS review of a decade of adult transplants found that full moons and Friday the 13th changed nothing: not donors, not recipients, not outcomes, not volume.</p>
  <p class="sub" data-frag>So we tested the mundane one. It is the obvious worry. Offers arrive overnight, at Christmas, on a long weekend, when the retrieval team is thinnest and the person on call is alone.</p>
  <p class="sub" data-frag>We tested it across <strong>1,216 offers</strong> with a decision and a date. Weekday acceptance <strong>22.3%</strong>. Weekend <strong>24.7%</strong>. Statutory holidays <strong>27.6%</strong>.</p>
  <p class="sub" data-frag>No difference in any direction that the numbers can support. <em>The bias we expected to find is not there.</em></p>
  <p class="mono sub" data-frag>Weekend vs weekday p = 0.39. Weekend or holiday vs weekday p = 0.25. DCD offers alone, 40.9% vs 37.3%, p = 0.65.</p>
  <p class="refline" data-frag>Goodnight Moon: the (not so) mystical effect of folklore and superstitions on cardiac transplantation. <em>J Heart Lung Transplant</em>, 2024. UNOS adult transplants 2013&ndash;2023. Confirm authors, volume and pages before presenting.</p>
 </div>
 <div class="stagew"><svg viewBox="0 0 470 320" aria-label="Donor offer acceptance by day of week">
  <line x1="52" y1="240" x2="452" y2="240" stroke="var(--dim)" stroke-width="1" opacity=".3"/>
  <line x1="52" y1="40" x2="52" y2="240" stroke="var(--dim)" stroke-width="1" opacity=".3"/>

    .map((d,i)=>{const x=74+i*54, h=200*d[1]/40, wknd=i>=5;
    return `<rect x="${x-17}" y="${240-h}" width="34" height="${h}" rx="1" fill="${wknd?'var(--gold)':'var(--slate)'}" opacity=".9" class="growup" style="--del:${.3+i*.12}s"/>

{heat:0,vol:32,phase:'The trap',
notes:'The loop runs backwards. Say it plainly: a small programme is structurally punished for taking chances, so it stops taking them, so it stays small. This is not a failure of courage. It is arithmetic.',
html:`<div class="split">
 <div>
  <div class="eyebrow">The trap</div>
  <h2>Every programme has a risk budget. Ours was too small.</h2>
  <p data-frag>Not from timidity. From exposure. When a single bad outcome moves your published rate by two points, declining is the rational move, and the budget never grows.</p>
  <p class="sub" data-frag>So you decline. So you stay small. So you remain exposed. <em>The loop runs backwards just as easily as forwards.</em></p>
 </div>

  <g class="wheel" style="animation-direction:reverse">

{heat:2,vol:61,phase:'The mechanism',
notes:'',
html:`<div class="split" style="align-items:center">
 <div>
  <div class="eyebrow">The mechanism</div>
  <h2>The same wheel turns both ways</h2>
  <p data-frag>Low volume means high exposure, so you decline, so you stay small. That loop runs on its own.</p>
  <p class="sub" data-frag>Run it forwards and it is just as self-sustaining. Volume creates tolerance for risk. Tolerance permits innovation. Innovation brings referrals and recruits, which produce volume.</p>
  <p class="sub" data-frag>Most versions of this argument skip the second step. <em>It is the only one that matters.</em></p>
 </div>
 <div class="stagew"><svg viewBox="0 0 460 400" aria-label="The loop running backwards and forwards">
  <g transform="translate(-8,0)">
   <g class="wheel" style="animation-direction:reverse;transform-origin:118px 200px">

      ['DIALYSIS RECOVERY','%',94.7,.5,'18 / 19 off dialysis']]
     .map(k=>`<div class="kpi cine" style="--del:${k[3]}s">
        <span class="kl">${k[0]}</span>
        <span class="kv" data-count="${k[2]}" data-dec="${Number.isInteger(k[2])?0:1}" data-del="${400+k[3]*1000}">0</span><span class="ku">${k[1]}</span>
        <span class="kl" style="margin-top:.3rem;font-size:10.5px;opacity:.8">${k[4]}</span>
      </div>`).join('')}
  </div>
  <div class="kpis" style="margin-top:.5rem">
   ${[['VASOPLEGIA','%',47.4,.6,'18 / 38'],
      ['ICU LOS','d',7,.7,'median &#183; n = 35'],
      ['POST-HTx LOS','d',18,.8,'median &#183; n = 29'],
      ['DIALYSIS','%',47.5,.9,'19 / 40'],
      ['TRACHEOSTOMY','%',12.5,1.1,'5 / 40']]
     .map(k=>`<div class="kpi cine" style="--del:${k[3]}s">
        <span class="kl">${k[0]}</span>
        <span class="kv" data-count="${k[2]}" data-dec="${Number.isInteger(k[2])?0:1}" data-del="${400+k[3]*1000}">0</span><span class="ku">${k[1]}</span>
        <span class="kl" style="margin-top:.3rem;font-size:10.5px;opacity:.8">${k[4]}</span>
      </div>`).join('')}
  </div>
 </div>
 <p class="sub" data-frag>Forty transplants by the end of July, <strong>one in five from a DCD donor</strong>, every one of them on machine perfusion. Dialysis is high at 47.5%, and <strong>nineteen of twenty recovered kidney function</strong>.</p>`},

{heat:3,vol:61,phase:'Autocorrection',
notes:'Watch the sequence: the PGD tile trips red, the alert fires, the team changes practice, and the curve bends back. This loop — measure, flag, respond, re-measure — is what let us grow without trading away outcomes. Say plainly that we found this because we were looking, not because someone complained.',
html:`<div class="split">
 <div>
  <div class="eyebrow">The correction loop</div>
  <h2>A dashboard that argues back</h2>
  <p data-frag>A reporting tool tells you what happened last year. A <em>correcting</em> tool tells you this month, while you can still act.</p>
  <ul class="sub">
   <li data-frag><strong>Measure continuously</strong>, not at the annual review.</li>
   <li data-frag><strong>Flag against your own baseline</strong>, not only the registry mean.</li>
   <li data-frag><strong>Close the loop.</strong> A metric nobody is accountable for is decoration.</li>
  </ul>
  <p class="sub" data-frag>We found this because we were <strong>looking</strong>, not because anyone complained.</p>
 </div>

 <div class="stagew">

{heat:3,vol:61,phase:'Comparison',
notes:'We went and looked. 210 a year against our 61 — three and a half times. Say it without defensiveness. The point is not that they are better; it is that at that volume these capabilities stop being projects you fight for and become simply how the programme runs.',
html:`<div class="eyebrow">The comparison</div>
 <h2>What a larger programme can simply do</h2>
 <div class="stagew" style="max-width:920px;margin:1rem 0"><svg viewBox="0 0 920 165" aria-label="Volume comparison">
  <text x="0" y="34" class="lab" fill="var(--slate)">US</text>
  <rect x="120" y="16" width="209" height="26" fill="var(--slate)" class="growx" style="--del:.3s"/>
  <text x="341" y="34" class="lab" fill="var(--slate)" style="opacity:0;animation:rise .6s ease 1.1s both">61</text>
  <text x="0" y="82" class="lab" fill="var(--accent)">US, 2029</text>
  <rect x="120" y="64" width="411" height="26" fill="none" stroke="var(--accent)" stroke-width="2"
    stroke-dasharray="7 5" class="growx" style="--del:.9s"/>
  <text x="543" y="82" class="lab" fill="var(--accent)" style="opacity:0;animation:rise .6s ease 1.7s both">120</text>
  <text x="0" y="130" class="lab" fill="var(--gold)">VANDERBILT</text>
  <rect x="120" y="112" width="720" height="26" fill="var(--gold)" class="growx" style="--del:1.5s"/>
  <text x="852" y="130" class="lab" fill="var(--gold)" style="opacity:0;animation:rise .6s ease 2.4s both">210</text>
 </svg></div>
 <div class="cols">
  <div class="card" data-frag><span class="n">01</span><h3>A dedicated retrieval team</h3><p>Not a rota. A team whose only job is procurement, available every night.</p></div>
  <div class="card" data-frag><span class="n">02</span><h3>Perfusion on the shelf</h3><p>Enough cases that a machine, a trained team, and a written protocol are standing ready rather than requested case by case.</p></div>
  <div class="card" data-frag><span class="n">03</span><h3>Someone owns each problem</h3><p>A named person accountable for graft dysfunction, for vasoplegia, for the data. Not a committee, and not everyone.</p></div>
  <div class="card" data-frag><span class="n">04</span><h3>Nights are staffed, not covered</h3><p>Retrieval at 2 a.m. is a shift someone is rostered to, not a favour asked of whoever is free.</p></div>
  <div class="card" data-frag><span class="n">05</span><h3>Research is infrastructure</h3><p>Coordinators, consent, and follow-up already exist, so a new trial is a protocol rather than a build.</p></div>
 </div>
 <p class="sub" data-frag>They do <strong>210</strong> a year. We do 61. Even our 2029 target lands at little over half their volume today, and that is the point. What they can simply do, we still have to justify.</p>`},

{heat:1,vol:37,phase:'The argument',
notes:'The central slide. Volume does not make you a better surgeon. It gives you a budget you can spend on being wrong — and every innovation is spent out of that budget.',
html:`<div class="eyebrow">The argument</div>
 <h2>Volume buys a risk budget</h2>
 <div class="stagew" style="max-width:980px;margin-top:1.2rem"><svg viewBox="0 0 980 210" aria-label="Risk budget grows with volume">
  ${[[28,'28 / YR',110,'var(--slate)',.2],[44,'44 / YR',180,'var(--cyan)',.7],[61,'61 / YR',250,'var(--amber)',1.2],[120,'120 / YR',480,'var(--gold)',1.7]]
   .map((b,i)=>`
    <text x="0" y="${34+i*48}" class="lab" fill="${b[3]}">${b[1]}</text>
    <rect x="130" y="${18+i*48}" width="${b[2]}" height="22" fill="${b[3]}" class="growx" style="--del:${b[4]}s"/>
    <text x="${142+b[2]}" y="${34+i*48}" class="lab" fill="${b[3]}"
      style="opacity:0;animation:rise .6s ease ${b[4]+.7}s both">${['NO ROOM','SOME ROOM','REAL ROOM','ROOM TO EXPERIMENT'][i]}</text>`).join('')}
 </svg></div>
 <p class="lede sub" data-frag>Not a licence for carelessness. <strong>Statistical room to be wrong</strong>, and every innovation we have made was spent out of that room.</p>`},

{heat:2,vol:61,phase:'PGD',
notes:'',
html:`<div class="split" style="align-items:center">
 <div>
  <div class="eyebrow">Our own numbers</div>
  <h2>Severe PGD sits at 13%, and the risk is not evenly spread</h2>
  <p data-frag>Across all 254 transplants: <strong>33 cases, 13.0%</strong>. Year to date it is <strong>12.5%</strong>, five of forty.</p>
  <p class="sub" data-frag>Split by donor type this year, it is <strong>9.4% after DBD</strong> and <strong>25% after DCD</strong>. That is the price of the pool we opened, stated plainly.</p>
  <p class="sub" data-frag>DCD was <strong>3.9%</strong> of our transplants across all years. This year it is <strong>20%</strong>. <em>We knew what we were buying.</em></p>
  <p class="mono sub" data-frag>Severe PGD defined as post-transplant mechanical support. Programme dashboard, source 27 July 2026.</p>

html:`<div class="split" style="align-items:center">
 <div>
  <div class="eyebrow">The list</div>
  <h2>From ten patients to forty</h2>
  <p data-frag>A waiting list is not a queue we inherit. It is a <em>population we go and find</em>.</p>

{heat:2,vol:61,phase:'Lever 02',
notes:'The audit nobody runs. We started asking why we said no, in a forum, every time. That single habit changed acceptance behaviour more than any policy.',
html:`<div class="split">
 <div>
  <div class="eyebrow">Lever 02 · The audit</div>
  <h2>We started asking why we said no</h2>
  <p data-frag>Not to second-guess the person on call. To make declining a <strong>decision with a record</strong> rather than a reflex with none.</p>
  <p class="sub" data-frag>Most programmes cannot tell you why they refused their last ten offers. We can.</p>
 </div>
 <div class="stagew"><svg viewBox="0 0 440 300" aria-label="Declines reviewed and reversed">
  ${Array.from({length:20},(_,i)=>{const x=40+(i%5)*84,y=40+Math.floor(i/5)*66,rev=i%5===1||i%5===3;
   return `<g class="pop" style="--del:${i*.05}s">
    <rect x="${x-26}" y="${y-18}" width="52" height="36" rx="2" fill="none"
      stroke="${rev?'var(--gold)':'var(--red)'}" stroke-width="2" opacity="${rev?1:.4}"/>
    ${rev?`<path d="M${x-11},${y} L${x-3},${y+8} L${x+12},${y-9}" fill="none" stroke="var(--gold)" stroke-width="2.6"
      class="draw" style="--len:40;--dur:.4s;--del:${1.4+i*.05}s"/>`:''}</g>`;}).join('')}
  <text x="40" y="286" class="lab" style="font-size:13px" fill="var(--gold)">REVERSIBLE ON SECOND LOOK</text>
 </svg></div>
</div>`},

{heat:2,vol:52,phase:'How we grew',
notes:'Growth was assembled, not found. Three workstreams, three owners. Replace the proportions with your own numbers.',
html:`<div class="eyebrow">How we grew</div>
 <h2>Twenty-eight to sixty-one in three years</h2>
 <div class="stagew" style="max-width:960px;margin-top:1rem"><svg viewBox="0 0 960 280" aria-label="Contributors to growth">
  <line x1="30" y1="234" x2="930" y2="234" stroke="var(--dim)" stroke-width="1" opacity=".3"/>
  ${[['Waitlist expansion','var(--cyan)',150,60],['Donor criteria','var(--amber)',185,340],['Retention on the list','var(--gold)',105,620]]
   .map((b,i)=>`
   <rect x="${b[3]}" y="${234-b[2]}" width="220" height="${b[2]}" fill="${b[1]}" class="growup" style="--del:${.4+i*.45}s"/>
   <text x="${b[3]+110}" y="264" text-anchor="middle" class="lab" style="opacity:0;animation:rise .7s ease ${.9+i*.45}s both">${b[0].toUpperCase()}</text>`).join('')}
  <text x="30" y="28" class="lab">MARGINAL TRANSPLANTS PER YEAR</text>
 </svg></div>
 <p class="sub" data-frag>Our trough was <strong>28</strong> in Jul '22 to Jun '23. Last year we did <strong>61</strong>. That is not a better year. It is <em>a different programme</em>.</p>
 <p class="mono" data-frag style="margin-top:.6rem">Decomposition proportions illustrative; volumes are real (July-to-July).</p>`},

{heat:1,vol:44,phase:'The argument',
notes:'Four things we could not have attempted at forty a year. Each one is a chance we took because the denominator let us.',
html:`<div class="eyebrow">What the budget bought</div>
 <h2>Four things we could not have tried at forty</h2>
 <div class="cols">
  <div class="card" data-frag><span class="n">01</span><h3>Marginal donors</h3><p>Older, longer distance, coronary disease, impaired first echo. Each acceptance is a bet the denominator can absorb.</p></div>
  <div class="card" data-frag><span class="n">02</span><h3>DCD retrieval</h3><p>A new pathway, a new team, and a learning curve you must be able to survive publicly.</p></div>
  <div class="card" data-frag><span class="n">03</span><h3>Randomizing</h3><p>PROTECT-PGD. A trial is a formal admission that you do not know, affordable only above a certain volume.</p></div>
  <div class="card" data-frag><span class="n">04</span><h3>Sensitized recipients</h3><p>The patients nobody else will list. The hardest, most rewarding use of the budget.</p></div>
 </div>`},

{heat:3,vol:120,phase:'سیمرغ',
notes:'Attar. Thirty birds cross seven valleys to find the Simorgh. Most turn back or die. The thirty who arrive find a mirror — si morgh, thirty birds. The sovereign they crossed the world for was the assembly of themselves. Let the birds converge, then say the last line and stop.',
html:`<div class="split">
 <div>
  <div class="eyebrow">Attar · Mantiq al-Tayr</div>
  <div class="fa-line" data-frag>سی مرغ رسیدند و سیمرغ بدیدند</div>
  <p class="lede sub" data-frag>Thirty birds arrived, and beheld the Simorgh.</p>
  <p class="sub" data-frag>They crossed seven valleys to find their sovereign. Most turned back. Most died on the way.</p>
  <p class="sub" data-frag>The thirty who arrived found a mirror. <em>Sī morgh</em>: thirty birds. The thing they had crossed the world to find was the <strong>assembly of themselves</strong>.</p>
  <p class="lede sub" data-frag>We did not go out and acquire innovation. We became the kind of programme that could produce it.</p>
 </div>

  <circle cx="200" cy="200" r="150" fill="none" stroke="var(--gold)" stroke-width="1" opacity=".3"/>

{heat:3,vol:61,phase:'2027',
notes:'',
html:`<div class="split">
 <div>
  <div class="eyebrow">Year one &middot; 2027</div>
  <h2 class="cine">Make severe PGD uncommon</h2>
  <ul class="sub">
   <li data-frag><strong>Severe PGD under 5%.</strong> The target, stated plainly, and reported against.</li>
   <li data-frag><strong>Risk assessed before the cross-clamp</strong>, with predictive models feeding a prevention protocol rather than a post-hoc explanation.</li>
   <li data-frag><strong>Standardized preservation, OR, and perioperative practice.</strong> Fewer ways to do it; better ways to do it.</li>
   <li data-frag><strong>Gradual rewarming</strong> at reperfusion rather than an abrupt return to temperature, and <strong>defined perfusion targets on pump</strong>: a stated mean arterial pressure, flow index and haematocrit, with a lactate the team is expected to act on rather than observe.</li>
   <li data-frag><strong>Selective angiotensin II</strong> for vasoplegia, used by protocol rather than as rescue.</li>
   <li data-frag><strong>PROTECT-PGD enrolling</strong> across Canadian sites.</li>
  </ul>
 </div>
 <div class="stagew"><svg viewBox="0 0 400 340" aria-label="Severe PGD target under five percent">
  ${Array.from({length:100},(_,i)=>{const hit=i<5;
   return `<circle cx="${24+(i%10)*38}" cy="${30+Math.floor(i/10)*28}" r="${hit?9:6}"
     fill="${hit?'var(--red)':'var(--gold)'}" opacity="${hit?1:.22}" class="pop" style="--del:${.3+i*.012}s"/>`;}).join('')}
  <text x="200" y="328" text-anchor="middle" class="lab" fill="var(--red)"
    style="opacity:0;animation:rise .8s ease 1.9s both">FEWER THAN 5 IN 100</text>
 </svg></div>
</div>`},

{heat:3,vol:61,phase:'The trials',
notes:'',
html:`<div class="eyebrow">The vision &#183; randomized and multicentre</div>
 <h2>Two studies we could not have run at twenty-eight</h2>
 <div class="cols" style="margin-top:1rem">
  <div class="card" data-frag><span class="n">PROTECT-PGD</span><h3>Controlled hypothermic preservation</h3>
   <p>Against cold static storage. Pan-Canadian pilot randomized trial. Does controlling the temperature of transport reduce primary graft dysfunction? Preservation technology was adopted on registry data; randomized evidence is still owed.</p></div>
  <div class="card" data-frag><span class="n">dd-cfDNA</span><h3>Surveillance without a needle</h3>
   <p>When the graft is injured it sheds donor DNA into the recipient&rsquo;s circulation. Measured as a fraction of total cell-free DNA, it rises before the echo changes.</p></div>
 </div>
 <div class="split" style="align-items:center;margin-top:1.1rem;gap:clamp(16px,3vw,48px)">

{heat:3,vol:61,phase:'2028',
notes:'',
html:`<div class="split" style="align-items:center">
 <div>
  <div class="eyebrow">Year two &#183; 2028</div>
  <h2 class="cine">Open the list</h2>
  <ul class="sub">
   <li data-frag><strong>Sensitized recipients listed, not deferred.</strong> Desensitization as routine practice rather than a rescue, and a defined crossmatch treated as a risk we can quantify.</li>
   <li data-frag><strong>ABO-incompatible listing in adults.</strong> The paediatric evidence is in and the adult registry shows no difference since 2005. We should be among the programmes that find out properly.</li>
  </ul>
  <p class="sub" data-frag>Each ring is a group of patients who are currently told to wait, or told nothing at all.</p>
 </div>

{heat:3,vol:61,phase:'2029',
notes:'',
html:`<div class="split" style="align-items:center">
 <div>
  <div class="eyebrow">Year three &#183; 2029</div>
  <h2 class="cine">Become the programme others build on</h2>
  <ul class="sub">
   <li data-frag><strong>Volume that sustains itself</strong>, with enough cases that these capabilities stop being projects and become how we run.</li>
   <li data-frag><strong>Shared allocation</strong>, with Toronto as a working hub rather than an aspiration.</li>
   <li data-frag><strong>Digital twins to test counterfactuals</strong>, to ask what would have happened had we chosen differently.</li>
   <li data-frag><strong>Our outcomes published openly</strong>, waitlist mortality beside survival.</li>
  </ul>
  <p class="sub" data-frag>The hearts do not arrive sorted. <em>Someone has to decide, every time, and we should be able to say how.</em></p>

{heat:3,vol:61,phase:'Wearables',
notes:'',
html:`<div class="split" style="align-items:center">
 <div>
  <div class="eyebrow">The vision &#183; two to three years</div>
  <h2>A wearable-informed allocation score</h2>
  <p data-frag>A deep learning model trained on daily wearable data from patients with heart failure predicts unplanned healthcare events. We published that this year.</p>
  <p class="sub" data-frag>The next step is to point it at the listing decision. Not how sick someone looked in clinic three months ago, but <strong>how they are actually living, measured continuously</strong>, feeding the urgency score that decides who gets the next offer.</p>
  <p class="sub" data-frag>Status today is a snapshot taken by whoever was in the room. <em>It could be a trajectory.</em></p>
 </div>
 <div class="stagew">

{heat:3,vol:61,phase:'ABOi · evidence',
notes:'Urschel and colleagues, Lancet Child and Adolescent Health, 2021. Two thousand two hundred and six children transplanted under age two, eleven thousand patient-years. After matching, graft survival was the same. The risk that everyone feared simply was not there.',
html:`<div class="eyebrow">The evidence</div>
 <h2>Matched, and no difference</h2>
 <div class="stagew" style="max-width:1000px;margin-top:.8rem"><svg viewBox="0 0 1000 300" aria-label="Graft survival ABOi versus ABOc">
  <line x1="60" y1="250" x2="960" y2="250" stroke="var(--dim)" stroke-width="1" opacity=".3"/>
  <line x1="60" y1="30" x2="60" y2="250" stroke="var(--dim)" stroke-width="1" opacity=".3"/>
  <path d="M60,52 L200,74 L340,96 L500,116 L660,132 L820,146 L960,156" fill="none"
    stroke="var(--slate)" stroke-width="4" class="draw" style="--len:960;--dur:2.4s;--del:.4s"/>
  <path d="M60,54 L200,78 L340,99 L500,120 L660,135 L820,148 L960,159" fill="none"
    stroke="var(--gold)" stroke-width="4" stroke-dasharray="9 6" class="draw" style="--len:960;--dur:2.4s;--del:.9s"/>
  <text x="968" y="152" class="lab" fill="var(--slate)" style="opacity:0;animation:rise .6s ease 2.9s both">ABOc</text>
  <text x="968" y="176" class="lab" fill="var(--gold)" style="opacity:0;animation:rise .6s ease 3.1s both">ABOi</text>
  <text x="70" y="24" class="lab">GRAFT SURVIVAL</text>
  <text x="510" y="286" text-anchor="middle" class="lab">YEARS AFTER TRANSPLANT</text>
  <text x="380" y="212" style="font-family:'Bricolage Grotesque';font-weight:800;font-size:34px;fill:var(--gold);opacity:0;animation:rise .8s ease 3.4s both">p = 0.84</text>
 </svg></div>
 <div class="cols">
  <div class="card" data-frag><span class="n">Cohort</span><h3>2,206 children</h3><p>Transplanted before age two; 11,333 patient-years of observation.</p></div>
  <div class="card" data-frag><span class="n">Groups</span><h3>364 vs 1,842</h3><p>ABO-incompatible against ABO-compatible, propensity matched.</p></div>
  <div class="card" data-frag><span class="n">Uptake</span><h3>70% listed</h3><p>Up to 70% of children listed in the first two years are listed ABOi; up to 40% receive one.</p></div>
 </div>
 <p class="mono sub" data-frag>Urschel et al, Lancet Child &amp; Adolescent Health, 2021 · PHTS registry analysis, 2020</p>`},

{heat:3,vol:61,phase:'Automation',
notes:'',
html:`<div class="split" style="align-items:center">
 <div>
  <div class="eyebrow">The vision &#183; the offer window</div>
  <h2>The risk score should already be on the screen</h2>
  <p data-frag>An offer arrives at ten at night. Angiogram images on a disc that has to be couriered. One person reads it and decides.</p>
  <p class="sub" data-frag>An <strong>agentic system</strong> would do the reading first. One agent per source, working in parallel, converging on a single profile before anyone picks up the phone.</p>
  <p class="sub" data-frag>The <strong>chest CT gives us sizing that weight never could</strong>: thoracic dimensions and predicted heart mass, measured rather than estimated.</p>
  <p class="sub" data-frag>It does not allocate. The clinician decides. The reasoning simply becomes <em>explicit, auditable, and available at three in the morning.</em></p>
 </div>
 <div class="stagew"><svg viewBox="0 0 460 340" aria-label="Agents converging on a donor profile">
  ${[['Echocardiogram','function'],['Echo report','interpretation'],['Chest CT','thoracic dimensions'],['Donor chart','labs, haemodynamics']]
    .map((ag,i)=>`<g class="inx" style="--del:${.3+i*.16}s;--fx:-30px">
      <rect x="0" y="${i*58}" width="188" height="46" rx="3" fill="var(--lift)" stroke="var(--accent)" stroke-width="1.5"/>
      <text x="14" y="${i*58+21}" style="font-family:'IBM Plex Sans',sans-serif;font-size:15px;fill:var(--ink)">${ag[0]}</text>

 <h2>Five things</h2>
 <ul style="max-width:62ch">
  <li data-frag><strong>Volume is not vanity. It is the size of the risk you can afford to take.</strong></li>
  <li data-frag><strong>28 to 61 transplants a year</strong>, and one in seven still leaves the list without one.</li>
  <li data-frag><strong>The gaps are at the front door, not the operating room.</strong></li>
  <li data-frag><strong>Growth bought us a risk budget, and we spent it deliberately.</strong></li>
  <li data-frag><strong>Nothing here is free.</strong> Fifteen years comes with vasculopathy, cancer, kidney disease.</li>
 </ul>
 <p class="lede sub" data-frag>Nobody on that waiting list needed us to be brave. They needed us to be <em>large enough that bravery cost them nothing.</em></p>

/* ================= ENGINE ================= */
const deck=document.getElementById('deck'),railFill=document.getElementById('railFill'),
sectEl=document.getElementById('sect'),pageEl=document.getElementById('pageno'),
hint=document.getElementById('hint');
let si=0,fi=0,last=-1;

SLIDES.forEach((s,i)=>{const el=document.createElement('section');el.className='slide';el.innerHTML=s.html;
  deck.appendChild(el);s.el=el;s.src=s.html;s.frags=[...el.querySelectorAll('[data-frag]')];});

let _au=null,_auBtn=null;
function cueAudio(btn,src){
  if(_au&&!_au.paused&&_auBtn===btn){_au.pause();btn.classList.remove('playing');btn.textContent='▶ play · 60–90 s';return;}
  if(_au){_au.pause(); if(_auBtn){_auBtn.classList.remove('playing');_auBtn.textContent='▶ play · 60–90 s';}}
  _au=new Audio(src); _auBtn=btn;
  _au.play().then(()=>{btn.classList.add('playing');btn.textContent='■ stop';})
    .catch(()=>{btn.classList.remove('playing');btn.textContent='add '+src+' beside this file';});
  _au.onended=()=>{btn.classList.remove('playing');btn.textContent='▶ play · 60–90 s';};
}
const DRIVE_EMBED='https://drive.google.com/file/d/1uCmBo44y2prao5CtyVfTk6__xwbI5Vbk/preview';
function initOverture(el){
  const f=el.querySelector('#driveVid'); if(!f) return;
  f.src=DRIVE_EMBED;
  f.addEventListener('load',()=>{
    const w=f.closest('.ytwrap'); if(!w) return;
    try{ if(f.contentWindow) w.classList.add('hasvideo'); }catch(e){ w.classList.add('hasvideo'); }
  },{once:true});
  setTimeout(()=>{const w=f.closest('.ytwrap');
    if(w && !w.classList.contains('hasvideo')) w.classList.remove('hasvideo');},2500);
}
function killVideo(){
  document.querySelectorAll('#driveVid').forEach(f=>{f.src='about:blank';});
  document.querySelectorAll('iframe#ytOverture').forEach(f=>{f.src='about:blank';});
}
function stopAudio(){if(_au){_au.pause();_au=null;} if(_auBtn){_auBtn.classList.remove('playing');_auBtn.textContent='▶ play · 60–90 s';_auBtn=null;}}
function runCounts(el){
  el.querySelectorAll('[data-count]').forEach(n=>{
    const to=+n.dataset.count,dec=+n.dataset.dec||0,del=+n.dataset.del||0,dur=1500,t0=performance.now()+del;
    (function tick(now){ if(!n.isConnected) return;
      const p=Math.min(1,Math.max(0,(now-t0)/dur)),e=1-Math.pow(1-p,3);
      n.textContent=(to*e).toFixed(dec);
      if(p<1) requestAnimationFrame(tick);
    })(performance.now());
  });
}
function buildBirds(el){
  const g=el.querySelector('#birdsC'); if(!g) return;
  const cols=['var(--amber)','var(--slate)','var(--cyan)','var(--gold)'];
  let o='';
  for(let i=0;i<30;i++){
    const a=(i/30)*Math.PI*2, r=118+((i*41)%46);
    const x=(Math.cos(a)*r).toFixed(1), y=(Math.sin(a)*r*.8).toFixed(1);
    const sc=(i%3===0)?1.2:(i%3===1?.88:1.02);
    o+='<g style="animation:converge30 11s cubic-bezier(.5,0,.3,1) '+(i*.035).toFixed(2)+'s infinite;--x:'+x+'px;--y:'+y+'px">'
      +'<g transform="translate(200,200) scale('+sc+')">'
      +'<path d="M-10,0 C-6.5,-5.5 -2,-6.5 0,-2 C2,-6.5 6.5,-5.5 10,0 C5.5,-1 2,0 0,2.2 C-2,0 -5.5,-1 -10,0 Z" '
      +'fill="'+cols[i%4]+'" opacity=".9" '
      +'style="transform-box:fill-box;transform-origin:center;animation:wing 1.15s ease-in-out '+(i*.06).toFixed(2)+'s infinite"/>'
      +'</g></g>';
  }
  g.innerHTML=o;
}
function replay(s){s.el.innerHTML=s.src;buildBirds(s.el);initOverture(s.el);runCounts(s.el);s.frags=[...s.el.querySelectorAll('[data-frag]')];void s.el.offsetWidth;
  s.el.querySelectorAll('[data-count]').forEach(n=>{
    const to=+n.dataset.count,dec=+n.dataset.dec||0,del=+n.dataset.del||0,dur=1400,t0=performance.now()+del;
    (function tick(now){if(!n.isConnected)return;
      const p=Math.min(1,Math.max(0,(now-t0)/dur)),e=1-Math.pow(1-p,3);
      n.textContent=(to*e).toFixed(dec);
      if(p<1)requestAnimationFrame(tick);})(performance.now());});}

const SECT_OF=(()=>{
  const names={'The status quo':'01 · Status quo','What we are changing':'02 · What we are changing','The vision':'03 · Vision'};
  let cur='', out=[];
  SLIDES.forEach(s=>{ if(names[s.phase]) cur=names[s.phase]; out.push(cur); });
  return out;
})();
const steps=()=>SLIDES.reduce((a,s)=>a+s.frags.length+1,0);
const done=()=>{let n=0;for(let i=0;i<si;i++)n+=SLIDES[i].frags.length+1;return n+fi+1;};

function render(){
  if(si!==last){stopAudio();killVideo();replay(SLIDES[si]);last=si;}
  SLIDES.forEach((s,i)=>s.el.classList.toggle('live',i===si));
  const c=SLIDES[si];
  c.frags.forEach((f,i)=>f.classList.toggle('shown',i<fi));
  document.body.dataset.heat=c.heat;
  {const bgs=['#FBFAF6','#F7FAF9','#FDF8F1','#FDF6EA'];const b=bgs[c.heat]||'#FBFAF6';
   document.documentElement.style.backgroundColor=b;document.body.style.backgroundColor=b;
   const bl=document.getElementById('bg');if(bl)bl.style.backgroundColor=b;}
  sectEl.textContent=SECT_OF[si]||'';
  pageEl.textContent=(si+1)+' / '+SLIDES.length;
  railFill.style.width=(done()/steps()*100)+'%';
  if(si>0)hint.classList.add('hide');
  location.hash=si+1;
}
function next(){const c=SLIDES[si];if(fi<c.frags.length)fi++;else if(si<SLIDES.length-1){si++;fi=0}else return;render();}
function prev(){if(fi>0)fi--;else if(si>0){si--;render();fi=SLIDES[si].frags.length}else return;render();}
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(['arrowright','arrowdown','pagedown',' '].includes(k)){e.preventDefault();next()}
  else if(['arrowleft','arrowup','pageup'].includes(k)){e.preventDefault();prev()}
  else if(k==='home'){si=0;fi=0;last=-1;render()}
  else if(k==='end'){si=SLIDES.length-1;fi=SLIDES[si].frags.length;render()}
  else if(k==='r'){last=-1;fi=0;render()}
});
deck.addEventListener('click',e=>{e.clientX>innerWidth*.3?next():prev()});
let tx=null;
deck.addEventListener('touchstart',e=>tx=e.changedTouches[0].clientX,{passive:true});
deck.addEventListener('touchend',e=>{if(tx===null)return;const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>45)d<0?next():prev();tx=null},{passive:true});
const st=parseInt(location.hash.replace('#',''),10);if(st>0&&st<=SLIDES.length)si=st-1;
render();
</script>
</body>
</html>
